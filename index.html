<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annual Operational Planning Tool</title>
<style>
/* NPA visual identity (Norsk Folkehjelp graphic profile), same look as the Country Office Annual Requirements checklist:
   primary greens #007745 / #009933, darkest #006C36, light greens #62BB46 / #9ACA3C, blue #009EE0, red #E2001A, orange #E75113. Arial. */
:root{--ink:#1A1A1A;--ink2:#3C3C3C;--mute:#5E5E5E;--line:#DCDDDA;--line2:#EDEEEC;--bg:#F3F4F2;--card:#FFFFFF;
--g1:#009933;--acc:#007745;--accD:#006C36;--accL:#E3F2E8;--g4:#62BB46;--g5:#9ACA3C;--div:#7FB89B;
--blue:#009EE0;--blueD:#00668F;--blueL:#E0F3FB;--red:#E2001A;--redD:#A30013;--redL:#FDE6E8;--org:#E75113;--amb:#A33A0A;--ambL:#FDEADF;--yel:#F2B705;--yelL:#FFF6D6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,Helvetica,sans-serif}
button,select,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--acc)}
.num{font-variant-numeric:tabular-nums}
/* ---- header (checklist style) */
.top{background:var(--acc);color:#fff;border-bottom:4px solid var(--g1);position:sticky;top:0;z-index:30}
.top-in{max-width:1480px;margin:0 auto;padding:10px 24px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.npa{display:flex;align-items:center;gap:14px;min-height:44px}
.npa img{height:40px;width:auto;display:block}
.npa .wm{font-weight:700;font-size:15px;line-height:1.08;letter-spacing:.01em}
.npa-div{width:1px;align-self:stretch;background:var(--div)}
.brand{font-weight:700;font-size:16px;line-height:1.15}
.brand small{display:block;font-weight:400;font-size:12.5px;color:#D8EEDF}
.hctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:#E3F2E8;margin-left:auto}
.hctl select,.hctl input{background:#fff;color:var(--ink);border:1px solid #fff;border-radius:6px;padding:5px 8px;font-size:13px}
.ctag{background:#fff;color:var(--accD);font-weight:700;border-radius:6px;padding:4px 10px;font-size:13px}
.savest{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--accD);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.savest i{width:8px;height:8px;border-radius:50%;background:var(--g1);display:inline-block}
.savest[data-s=dirty] i,.savest[data-s=saving] i{background:var(--yel)}
.savest[data-s=error]{background:var(--redL);color:var(--redD)}.savest[data-s=error] i{background:var(--red)}
.savest[data-s=ro] i{background:#9AA}
.hbtn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700}
.hbtn:hover{background:rgba(255,255,255,.14)}
.hbtn.round{width:30px;height:30px;padding:0;font-size:15px;line-height:1}
.vtabs{flex-basis:100%;display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.vtabs button{background:transparent;border:0;color:#E3F2E8;font-weight:700;font-size:13.5px;padding:10px 13px 9px;border-radius:8px 8px 0 0;display:inline-flex;align-items:center;gap:7px}
.vtabs button:hover{background:rgba(255,255,255,.12);color:#fff}
.vtabs button.on{background:var(--bg);color:var(--accD)}
.vtabs .cnt{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
.vtabs button.on .cnt{background:var(--red)}
.subnav{max-width:1480px;margin:0 auto;padding:14px 24px 0;display:flex;flex-wrap:wrap;gap:6px}
.subnav button{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.subnav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:20px 24px 28px;max-width:1480px;margin:0 auto}
footer.npa-f{max-width:1480px;margin:0 auto;padding:0 24px 28px;font-size:12px;color:var(--mute)}
/* ---- panels and layout */
.panel{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--acc);border-radius:10px;padding:18px 20px}
.panel.plain{border-top:1px solid var(--line)}
.panel.hero{background:linear-gradient(0deg,#fff,#fff);border-top-color:var(--g1)}
.panel h2{margin:0;font-size:17px}.panel h3{margin:0;font-size:15px}
.ph{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.sub{margin:4px 0 0;color:var(--mute);font-size:13px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.grow{flex:999 1 620px;min-width:0}.side{flex:1 1 330px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--g1)}
.kpi.warn:before{background:var(--org)}.kpi.bad:before{background:var(--red)}.kpi.info:before{background:var(--blue)}
.kpi .l{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--mute);margin-top:4px}
.kpi .spark{position:absolute;right:10px;bottom:8px;opacity:.9}
/* ---- controls */
.btn{border:0;background:var(--acc);color:#fff;border-radius:6px;padding:9px 14px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--accD)}
.btn.sec{border:1px solid var(--acc);color:var(--acc);background:#fff}.btn.sec:hover{background:var(--accL)}
.btn.ghost{border:1px solid var(--line);color:var(--ink2);background:#fff;font-weight:400}.btn.ghost:hover{border-color:#B9BBB7}
.btn.danger{background:#fff;color:var(--redD);border:1px solid #E7B7BD}.btn.danger:hover{background:var(--redL)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:12.5px}
.pill.on{border-color:var(--acc);background:var(--acc);color:#fff}
.fields{display:flex;flex-wrap:wrap;gap:12px}
label.f{display:block;font-size:12.5px;color:var(--mute);flex:1 1 150px;min-width:0}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:8px;border:1px solid #C8CAC6;border-radius:6px;color:var(--ink);background:#fff}
label.f.req>span:after{content:' *';color:var(--red)}
.inp{padding:6px 8px;border:1px solid #C8CAC6;border-radius:6px;background:#fff;width:100%}
.inp.num{text-align:right}
.box{background:#F6F7F5;border-radius:8px;padding:14px}
.box.g{background:#F1F8EE;border:1px dashed #B5DCA0}
.note{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--accL);font-size:13.5px}
.note.warn{background:var(--ambL);color:#5C2304}.note.bad{background:var(--redL);color:#6B000C}.note.info{background:var(--blueL);color:#003F59}
.msg{margin:10px 0 0;font-size:13.5px;font-weight:700;color:var(--acc)}
.err{margin:10px 0 0;font-size:13.5px;color:var(--redD);font-weight:700}
.muted{color:var(--mute)}
.small{font-size:12.5px}
code{font-family:Consolas,'Courier New',monospace;font-size:12.5px;background:#F0F1EF;padding:1px 5px;border-radius:4px;word-break:break-all}
/* ---- tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;color:var(--ink2);font-weight:700;border-bottom:2px solid var(--g1);padding:8px 8px;white-space:nowrap;background:#fff;position:sticky;top:0}
table.t td{border-bottom:1px solid var(--line2);padding:7px 8px;vertical-align:middle}
table.t tr:hover td{background:#FAFBF9}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.sel td{background:var(--accL)}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-plan{background:#EDEEEC;color:#3C3C3C}.b-on{background:var(--blueL);color:#00577A}.b-sus{background:var(--ambL);color:var(--amb)}.b-done{background:var(--accL);color:var(--accD)}
.b-draft{background:#EDEEEC;color:#3C3C3C}.b-sub{background:var(--yelL);color:#6B4E00}.b-qc{background:var(--blueL);color:#00577A}.b-ap{background:var(--accL);color:var(--accD)}.b-ret{background:var(--redL);color:var(--redD)}.b-rev{background:var(--ambL);color:var(--amb)}
.b-high{background:var(--redL);color:var(--redD)}.b-med{background:var(--ambL);color:var(--amb)}.b-low{background:#EDEEEC;color:#3C3C3C}
.dev{font-weight:700;border-radius:6px;padding:2px 7px;display:inline-block;min-width:54px;text-align:center}
.dev.ok{background:var(--accL);color:var(--accD)}.dev.lo{background:var(--redL);color:var(--redD)}.dev.hi{background:var(--blueL);color:#00577A}.dev.na{background:#EDEEEC;color:var(--mute)}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden;min-width:60px}.bar>i{display:block;height:100%;background:var(--g1)}
/* ---- charts */
.chart{width:100%;display:block}
.chart text{font-family:Arial,Helvetica,sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;border-radius:2px;width:16px}
.legend i.dash{height:0;border-top:2px dashed #888;width:16px;border-radius:0}
.tip{position:fixed;pointer-events:none;background:#1A1A1A;color:#fff;font-size:12.5px;padding:6px 9px;border-radius:6px;z-index:90;max-width:280px;display:none;line-height:1.35}
/* ---- process / steps / todo */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%}
.step:hover{border-color:var(--acc)}
.step .no{flex:0 0 28px;height:28px;border-radius:50%;background:var(--line2);color:var(--ink2);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.step.done .no{background:var(--g1);color:#fff}.step.now{border-color:var(--acc);box-shadow:0 0 0 2px var(--accL)}.step.now .no{background:var(--acc);color:#fff}
.step b{display:block;font-size:13.5px}.step span{font-size:12.5px;color:var(--mute)}
.todo{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.todo:last-child{border-bottom:0}
.todo .ic{flex:0 0 30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accL);color:var(--accD);font-weight:700}
.alert{border:1px solid var(--line);border-left:5px solid var(--red);border-radius:8px;padding:10px 12px;background:#fff;margin-bottom:8px}
.alert.Medium{border-left-color:var(--org)}.alert.Low{border-left-color:#A9ADA6}
.alert.ack{opacity:.6}
/* ---- gantt */
.gwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.gt{display:grid;font-size:12px;position:relative}
.glab{position:sticky;left:0;background:#fff;z-index:3;border-right:1px solid var(--line);padding:4px 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead{position:sticky;top:0;background:#fff;z-index:4;border-bottom:2px solid var(--g1);font-weight:700;color:var(--ink2)}
.gbar{position:absolute;height:18px;border-radius:4px;font-size:11px;color:#fff;padding:1px 5px;overflow:hidden;white-space:nowrap;cursor:pointer}
/* ---- calendar */
.cal{border-collapse:collapse;font-size:11.5px}
.cal td,.cal th{border:1px solid var(--line2);width:26px;height:26px;text-align:center;padding:0}
.cal th{background:#fff;color:var(--ink2);position:sticky;top:0}
.cal td.lab{width:auto;min-width:90px;text-align:left;padding:0 8px;position:sticky;left:0;background:#fff;font-weight:700}
.cal td.we{background:#F0F1EF}
.cal td.c{color:#fff;font-weight:700;cursor:pointer}
.cal td.today{outline:2px solid var(--blue);outline-offset:-2px}
/* ---- modal / toast */
.modal{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal .mc{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:20px;border-top:6px solid var(--acc);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:17px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accD);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:95;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
/* ---- guidelines */
.gl{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.gl nav{position:sticky;top:150px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.gl nav a{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink2);font-size:13.5px}
.gl nav a:hover{background:var(--accL);color:var(--accD)}
.gl section{scroll-margin-top:160px}
.gl h2{font-size:19px;margin:0 0 6px;color:var(--accD)}
.gl h3{font-size:15px;margin:16px 0 6px}
.gl p,.gl li{font-size:14px;line-height:1.55}
.gl .call{border-left:5px solid var(--g1);background:var(--accL);padding:10px 14px;border-radius:6px;margin:10px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700}
.flow b{color:var(--mute)}
details.sum>summary{cursor:pointer;color:var(--acc);font-weight:700;font-size:13px}
.empty{text-align:center;padding:34px 18px;color:var(--mute)}
.empty h3{color:var(--ink);font-size:17px;margin:0 0 6px}
.center{max-width:760px;margin:40px auto}
.hide-sm{}
@media (max-width:900px){.gl{grid-template-columns:1fr}.gl nav{position:static}.grid2{grid-template-columns:1fr}}
@media (max-width:620px){.top{position:static}.top-in{padding:10px 14px 0}main{padding:14px}.subnav{padding:12px 14px 0}.hctl{margin-left:0}.hide-sm{display:none}.vtabs button{padding:8px 9px;font-size:12.5px}.kpi .v{font-size:22px}.panel{padding:14px}}
@media print{.top,.subnav,.btns,.hctl{display:none!important}body{background:#fff}.panel{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip"></div>
<script src="config.js"></script>
<script>
'use strict';
/* =====================================================================
   NPA Annual Operational Planning Tool (v4)
   One copy per country office. Each copy reads config.js (country, ArcGIS
   connection, layer) and keeps all data in that country's own ArcGIS Online
   hosted feature layer. Built from src/ by build.py — do not edit index.html.
   ===================================================================== */
const APP_VERSION = '4.0';
const CFG = Object.assign({ country: '', portalUrl: 'https://www.arcgis.com', clientId: '', itemId: '', logoUrl: 'npa-logo.png', orgName: "Norwegian People's Aid" }, window.AOP_CONFIG || {});
const CONFIG = { appTag: 'AOPPlanningTool', autosaveDelayMs: 1200, refreshMs: 60000 };
const COUNTRIES = ['Afghanistan', 'Angola', 'Bosnia and Herzegovina', 'Cambodia', 'Iraq', 'Kosovo', 'Lao PDR', 'Lebanon', 'Mozambique', 'Myanmar', 'Palestine', 'Peru', 'Syria', 'Thailand', 'Ukraine', 'Vietnam', 'Yemen', 'Zimbabwe'];
const YEARS = ['2026', '2027', '2028', '2029', '2030', '2031', '2032', '2033', '2034', '2035'];

// ---------------------------------------------------------------- schema
const S_ = (name, len) => ({ name: name, type: 'esriFieldTypeString', alias: name, length: len || 255, nullable: true, editable: true });
const I_ = name => ({ name: name, type: 'esriFieldTypeInteger', alias: name, nullable: true, editable: true });
const D_ = name => ({ name: name, type: 'esriFieldTypeDouble', alias: name, nullable: true, editable: true });
const TABLES = {
  settings: { id: 0, name: 'Settings', fields: [S_('uid', 64), I_('plan_year'), S_('key', 64), S_('value', 4000)] },
  roles: { id: 1, name: 'Roles', fields: [S_('uid', 64), I_('plan_year'), S_('username', 128), S_('full_name', 128), S_('role', 32), I_('active')] },
  teams: { id: 2, name: 'Teams', fields: [S_('uid', 64), I_('plan_year'), S_('team_id', 64), S_('team_type', 32), I_('units'), S_('base', 128), S_('leader', 128), S_('available_from', 10), S_('available_to', 10), S_('status', 20), S_('notes', 1000)] },
  assets: { id: 3, name: 'Assets', fields: [S_('uid', 64), I_('plan_year'), S_('asset_id', 128), S_('name', 128), S_('category', 32), S_('team_id', 64), I_('quantity'), S_('base', 128), S_('status', 20), S_('available_from', 10), S_('available_to', 10), S_('donor', 64), S_('notes', 1000)] },
  tasks: { id: 4, name: 'Tasks', fields: [S_('uid', 64), I_('plan_year'), S_('task_id', 128), S_('name', 255), S_('province', 128), S_('district', 128), S_('village', 128), S_('donor', 64), D_('area_m2'), S_('contamination', 32), S_('priority', 16), S_('status', 20), S_('status_date', 10), S_('status_reason', 1000), I_('cancel_pct'), I_('reduce_pct'),
    S_('plan_status', 24), I_('plan_version'), S_('editors', 1000), S_('submitted_by', 128), S_('submitted_on', 24), S_('qc_by', 128), S_('qc_on', 24), S_('qc_note', 1000), S_('approved_by', 128), S_('approved_on', 24), S_('approval_note', 1000), S_('baseline', 200000), S_('notes', 1000)] },
  activities: { id: 5, name: 'Activities', fields: [S_('uid', 64), I_('plan_year'), S_('task_uid', 64), S_('activity', 64), S_('method', 64), S_('start_date', 10), I_('work_days'), S_('status', 20), S_('depends_on', 64), S_('notes', 1000)] },
  assignments: { id: 6, name: 'Assignments', fields: [S_('uid', 64), I_('plan_year'), S_('activity_uid', 64), S_('team_id', 64), D_('area_m2')] },
  calendar: { id: 7, name: 'Calendar', fields: [S_('uid', 64), I_('plan_year'), S_('entry_type', 8), S_('start_date', 10), S_('end_date', 10), S_('teams', 2000), S_('note', 255), S_('source', 32)] },
  rates: { id: 8, name: 'Rates', fields: [S_('uid', 64), I_('plan_year'), S_('team_type', 32), S_('method', 64), D_('rate'), S_('source', 64), S_('notes', 500)] },
  progress: { id: 9, name: 'Progress', fields: [S_('uid', 64), I_('plan_year'), S_('week_start', 10), S_('team_id', 64), S_('task_uid', 64), S_('activity_uid', 64), D_('days_worked'), D_('m2_processed'), D_('m2_cleared'), D_('m2_reduced'), D_('m2_cancelled'), I_('items_ap'), I_('items_at'), I_('items_uxo'), I_('eore_sessions'), I_('eore_people'), D_('hours_lost_internal'), D_('hours_lost_external'), S_('notes', 1000), S_('source', 24)] },
  op_plans: { id: 10, name: 'OperationalPlans', fields: [S_('uid', 64), I_('plan_year'), S_('period_type', 12), S_('period', 12), I_('version'), S_('status', 20), S_('snapshot', 1000000), S_('sig', 2000), S_('generated_by', 128), S_('generated_on', 24), S_('verified_by', 128), S_('verified_on', 24), S_('approved_by', 128), S_('approved_on', 24), S_('note', 2000)] },
  changelog: { id: 11, name: 'ChangeLog', fields: [S_('uid', 64), I_('plan_year'), S_('ts', 24), S_('username', 128), S_('entity', 32), S_('record_uid', 64), S_('action', 24), S_('summary', 1000), S_('justification', 2000), S_('before', 8000), S_('after', 8000)] },
  alert_acks: { id: 12, name: 'AlertAcks', fields: [S_('uid', 64), I_('plan_year'), S_('alert_key', 128), S_('note', 500), S_('ack_by', 128), S_('ack_on', 24)] }
};

const AUDITED = ['roles', 'teams', 'assets', 'tasks', 'activities', 'assignments', 'calendar', 'rates', 'progress', 'op_plans', 'settings'];

async function refreshData(force) {

    const fresh = {};

      const m = new Map(), gone = new Set(delOids[k]);
      fresh[k].forEach(a => {

        noteSeen(k, a);
        if (loc && pv === '*') m.set(id, { a: Object.assign({}, a, loc.a), oid: a.OBJECTID });
        else if (loc && pv) { const x = Object.assign({}, a); Object.keys(pv).forEach(f => { x[f] = loc.a[f]; }); m.set(id, { a: x, oid: a.OBJECTID }); }

      DB[k] = m;

}

// ---------------------------------------------------------------- Schedule (Gantt by team or by task)
PAGES.schedule = function (M) {
  const g = S.ui.gs = S.ui.gs || { by: 'team', type: '', st: '' };
  const CW = 30, x = d => (d + M.OFF) * CW / 7, W = M.NW * CW;
  const lanes = [];
  if (g.by === 'team') M.TEAMS.filter(t => !g.type || M.teamOf[t].team_type === g.type).forEach(t => lanes.push({ label: t, sub: M.teamOf[t].team_type, bars: M.asg.filter(r => r.team === t && (!g.st || (r.task.status || 'Planned') === g.st)), team: t }));
  else M.T.filter(t => !g.st || (t.status || 'Planned') === g.st).forEach(t => { const l = M.asg.filter(r => r.task === t && (!g.type || (M.teamOf[r.team] || {}).team_type === g.type)); if (l.length) lanes.push({ label: t.task_id, sub: t.status || 'Planned', bars: l, tuid: t.uid }); });
  const col = r => r.task.status === 'Completed' || r.a.status === 'Completed' ? COL.act : r.task.status === 'Suspended' ? COL.org : r.a.status === 'Ongoing' || r.task.status === 'Ongoing' ? COL.blue : '#8C918A';
  let h = '<div class="stack"><div class="panel"><div class="ph"><div><h2>Schedule ' + M.Y + '</h2><p class="sub">Each bar is one team on one activity, placed on the team\'s working days. Grey = planned, blue = ongoing, green = completed, orange = suspended task. Hatched = days released by a suspended or completed task. Updates live as plans change.</p></div>' +
    '<div class="btns"><span class="pills"><button class="pill' + (g.by === 'team' ? ' on' : '') + '" data-click="gBy" data-arg="team">By team</button><button class="pill' + (g.by === 'task' ? ' on' : '') + '" data-click="gBy" data-arg="task">By task</button></span>' + '<select class="inp" style="width:auto" data-bind="gs.type">' + opts(TEAM_TYPES, g.type, 'All team types') + '</select><select class="inp" style="width:auto" data-bind="gs.st">' + opts(TASK_STATUS, g.st, 'All task statuses') + '</select></div></div>';
  if (!lanes.length) return h + empty('Nothing scheduled', 'Plan activities on the Tasks tab; they appear here at once.') + '</div></div>';
  h += '<div class="gwrap" data-keep="gantt" style="max-height:72vh"><div style="position:relative;width:' + (190 + W) + 'px">' +
    '<div style="display:flex;position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--g1)"><div style="flex:0 0 190px;position:sticky;left:0;background:#fff;z-index:6"></div><div style="position:relative;height:34px;flex:0 0 ' + W + 'px">' +
    MN.map((mn, k) => { const d = M.idx(M.Y + '-' + pad2(k + 1) + '-01'); return '<span style="position:absolute;left:' + x(d) + 'px;top:2px;font-size:12px;font-weight:700;color:var(--ink2);border-left:1px solid var(--line);padding-left:4px">' + mn + '</span>'; }).join('') +
    Array.from({ length: M.NW }, (_, w) => '<span style="position:absolute;left:' + (w * CW) + 'px;top:19px;font-size:10px;color:#999;width:' + CW + 'px;text-align:center">' + (w % 2 ? '' : 'W' + (w + 1)) + '</span>').join('') + '</div></div>';
  lanes.forEach(L => {
    const off = L.team ? (() => { const s = []; for (let i = 0; i < M.N; i++) { const c = M.codes[L.team][i]; if (CAL[c] && c !== 'PH') s.push([i, c]); } return s; })() : [];
    h += '<div style="display:flex;border-bottom:1px solid var(--line2);height:34px"><div style="flex:0 0 190px;position:sticky;left:0;background:#fff;z-index:4;padding:4px 10px;font-size:12.5px;border-right:1px solid var(--line);overflow:hidden;white-space:nowrap;text-overflow:ellipsis"' + (L.tuid ? ' data-click="go" data-arg="tasks||' + L.tuid + '" style="cursor:pointer"' : '') + '><b>' + esc(L.label) + '</b> <span class="muted small">' + esc(L.sub) + '</span></div><div style="position:relative;flex:0 0 ' + W + 'px">' +
      off.map(o => '<i style="position:absolute;top:4px;bottom:4px;left:' + x(o[0]) + 'px;width:' + (CW / 7) + 'px;background:' + CAL[o[1]].bg + ';opacity:.35"' + tipAttr(L.label + ' ' + dshort(M.isoOf(o[0])) + ': ' + CAL[o[1]].label) + '></i>').join('') +
      L.bars.map(r => rlEncode(r.used).map(s => '<i data-click="go" data-arg="tasks||' + r.task.uid + '" style="position:absolute;top:8px;height:18px;left:' + x(s[0]) + 'px;width:' + Math.max(3, s[1] * CW / 7 - 1) + 'px;background:' + col(r) + ';border-radius:3px;cursor:pointer"' + tipAttr((g.by === 'team' ? r.task.task_id : r.team) + ' · ' + r.a.act + ' (' + r.a.method + ') · ' + dshort(M.isoOf(s[0])) + '–' + dshort(M.isoOf(s[0] + s[1] - 1)) + ' · task ' + (r.task.status || 'Planned')) + '></i>').join('') + (r.cutDays && r.e !== null ? '<i style="position:absolute;top:8px;height:18px;left:' + x(r.e + 1) + 'px;width:' + (r.cutDays * CW / 5) + 'px;background:repeating-linear-gradient(45deg,#E75113 0 3px,#fff 3px 7px);opacity:.6;border-radius:3px"' + tipAttr(r.cutDays + ' working days released (' + r.task.task_id + ' ' + r.task.status.toLowerCase() + ')') + '></i>' : '')).join('') +
      (L.team ? Array.from(M.used[L.team].entries()).filter(e => e[1].length > 1).map(e => '<i style="position:absolute;top:2px;height:4px;left:' + x(e[0]) + 'px;width:' + (CW / 7) + 'px;background:' + COL.red + '"' + tipAttr('Double booking ' + dshort(M.isoOf(e[0]))) + '></i>').join('') : '') +

// ---------------------------------------------------------------- Weekly progress: entry, upload, records
const PG_COLS = [['days_worked', 'Days', 1], ['m2_processed', 'm² processed', 0], ['m2_cleared', 'Cleared', 0], ['m2_reduced', 'Reduced', 0], ['m2_cancelled', 'Cancelled', 0], ['items_ap', 'AP', 0], ['items_at', 'AT', 0], ['items_uxo', 'UXO/CMR', 0], ['eore_sessions', 'EORE sess.', 0], ['eore_people', 'People', 0], ['hours_lost_internal', 'h lost int.', 1], ['hours_lost_external', 'h lost ext.', 1]];
const curWeek = M => S.ui.pw === undefined || S.ui.pw === null ? Math.max(0, M.tdWeek - 1) : S.ui.pw;
function weekRows(M, w) {
  const ws = M.weekStart(w), out = [], seenK = new Set();
  M.asg.forEach(r => {
    const days = r.used.filter(d => M.weekOf(d) === w).length; if (!days) return;
    const k = r.a.uid + '|' + r.team; if (seenK.has(k)) return; seenK.add(k);
    out.push({ a: r.a, team: r.team, task: r.task, pDays: days, pM2: r.per * days, rec: M.prog.find(p => p.week_start === ws && p.activity_uid === r.a.uid && p.team_id === r.team) });
  });
  M.prog.filter(p => p.week_start === ws).forEach(p => { const k = p.activity_uid + '|' + p.team_id; if (seenK.has(k)) return; seenK.add(k); const a = M.actBy[p.activity_uid]; out.push({ a: a, team: p.team_id, task: M.taskBy[p.task_uid], pDays: 0, pM2: 0, rec: p, extra: true }); });
  return out.filter(x => x.a && x.task).sort((p, q) => p.team.localeCompare(q.team, undefined, { numeric: true }) || p.task.task_id.localeCompare(q.task.task_id));
}
PAGES.progress = function (M) { return ({ week: progressWeek, upload: progressUpload, history: progressHistory })[subOf('progress')](M); };

function progressWeek(M) {
  const w = curWeek(M), ws = M.weekStart(w), we = isoOfDay(dayOf(ws) + 6), f = S.ui.pgf = S.ui.pgf || { team: '', type: '' };
  const R = weekRows(M, w).filter(x => (!f.team || x.team === f.team) && (!f.type || (M.teamOf[x.team] || {}).team_type === f.type));
  const ed = can('progress');
  const tot = R.reduce((s, x) => { s.p += x.pM2; s.a += x.rec && isArea(x.a.method) ? Number(x.rec.m2_processed) || 0 : 0; return s; }, { p: 0, a: 0 });
  let h = '<div class="stack"><div class="panel"><div class="ph"><div><h2>Week ' + (w + 1) + ': ' + dlong(ws) + ' – ' + dlong(we) + '</h2><p class="sub">One row per team and activity planned this week. Enter what the team actually did; figures save automatically. Planned figures come from the task plans.</p></div>' +
    '<div class="btns"><button class="btn ghost sm" data-click="pweek" data-arg="-1" aria-label="Previous week">‹ Previous</button><button class="btn ghost sm" data-click="pweek" data-arg="0">Last week</button><button class="btn ghost sm" data-click="pweek" data-arg="1" aria-label="Next week">Next ›</button><button class="btn sec sm" data-click="weekSheet" data-arg="' + w + '">Download this week\'s sheet</button></div></div>' +
    '<div class="fields" style="max-width:560px;margin-bottom:10px">' + fld('Team type', bindSel('pgf.type', TEAM_TYPES, f.type, 'All')) + fld('Team', bindSel('pgf.team', M.TEAMS, f.team, 'All teams')) + '</div>';
  if (!R.length) h += empty('Nothing planned this week', 'No team was planned to work in this week' + (f.team || f.type ? ' for the selected filter' : '') + '. Use "Add unplanned work" below if a team worked anyway.');
  else {
    h += '<div class="kpis" style="margin-bottom:12px">' + kpi('Planned this week', fmtA(tot.p), R.length + ' team assignments') + kpi('Achieved', fmtA(tot.a), R.filter(x => x.rec).length + ' of ' + R.length + ' rows filled', tot.p && tot.a < tot.p * (1 - M.DEV / 100) ? 'warn' : '') + kpi('Deviation', devTxt(tot.p ? M.dev(tot.a, tot.p) : null), 'achieved vs planned this week', devCls(tot.p ? M.dev(tot.a, tot.p) : null, M.DEV) === 'lo' ? 'bad' : '') + '</div>';
    h += '<div class="tw" data-keep="pgt"><table class="t" style="min-width:1500px"><thead><tr><th>Team</th><th>Task · activity</th><th class="n">Plan days</th><th class="n">Plan m²</th>' + PG_COLS.map(c => '<th class="n">' + c[1] + '</th>').join('') + '<th>Notes</th><th class="n">Dev.</th></tr></thead><tbody>' +
      R.map(x => { const r = x.rec || {}, arg = x.a.uid + '|' + x.team + '|' + w, area = isArea(x.a.method), d = area && x.pM2 && r.m2_processed !== undefined && r.m2_processed !== null && r.m2_processed !== '' ? M.dev(Number(r.m2_processed), x.pM2) : null, lock = x.task.status === 'Completed' && x.task.status_date && ws > x.task.status_date;
        return '<tr' + (x.extra ? ' style="background:#FFFBEA"' : '') + '><td><b>' + esc(x.team) + '</b></td><td style="white-space:nowrap"><a href="#" data-click="go" data-arg="tasks||' + x.task.uid + '">' + esc(x.task.task_id) + '</a><br><span class="small muted">' + esc(x.a.method) + (x.extra ? ' · unplanned' : '') + '</span></td><td class="n">' + (x.pDays || '–') + '</td><td class="n">' + (area ? fmt(x.pM2) : '–') + '</td>' +
          PG_COLS.map(c => '<td><input class="inp num" style="width:' + (/^m2/.test(c[0]) ? 96 : 62) + 'px" type="number" min="0" step="' + (c[2] ? '0.5' : '1') + '" value="' + (r[c[0]] === null || r[c[0]] === undefined ? '' : r[c[0]]) + '" data-change="pg" data-arg="' + esc(arg + '|' + c[0]) + '"' + (ed && !lock ? '' : ' disabled') + ' aria-label="' + esc(x.team + ' ' + c[1]) + '"></td>').join('') +
          '<td><input class="inp" style="width:160px" value="' + esc(r.notes || '') + '" data-change="pg" data-arg="' + esc(arg + '|notes') + '"' + (ed && !lock ? '' : ' disabled') + '></td><td class="n">' + devHtml(d, M.DEV) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    h += '<p class="small muted" style="margin-top:8px">m² processed = total area worked; split it into cleared, reduced and cancelled. Leave m² processed blank to use the sum. Items found: anti-personnel (AP), anti-tank (AT) and UXO/CMR. Hours lost follow the MPR downtime definitions.</p>';
  }
  if (ed) h += '<div class="box" style="margin-top:12px"><b>Add unplanned work</b><p class="small muted" style="margin:2px 0 8px">For a team that worked on an activity it was not planned on this week.</p><div class="fields">' + fld('Activity', bindSel('pga.act', M.acts.filter(a => a.task.status !== 'Completed').map(a => [a.uid, a.task.task_id + ' · ' + a.method]), (S.ui.pga || {}).act, 'Choose…')) + fld('Team', bindSel('pga.team', M.TEAMS, (S.ui.pga || {}).team, 'Choose…')) + '</div><button class="btn sec sm" style="margin-top:8px" data-click="pgAdd" data-arg="' + w + '">Add row</button></div>';
  h += '</div>';
  if (R.length) {
    const teams = Array.from(new Set(R.map(x => x.team)));
    h += '<div class="panel"><h2>This week by team</h2>' + hbars(teams.map(t => { const l = R.filter(x => x.team === t), p = l.reduce((s, x) => s + x.pM2, 0), a = l.reduce((s, x) => s + (x.rec && isArea(x.a.method) ? Number(x.rec.m2_processed) || 0 : 0), 0), d = p ? M.dev(a, p) : null; return { label: t, value: a, plan: p || null, color: devCls(d, M.DEV) === 'lo' ? COL.red : COL.act, sub: fmt(a) + (p ? ' / ' + fmt(p) : '') }; }), { planLegend: true }) + '</div>';
  }
  return h + '</div>';
}

function progressHistory(M) {

    '<div class="panel"><h2>Share with the team</h2><p class="sub">Users need the layer shared with their ArcGIS group. Members of a shared update group can edit; other groups can only view.</p>' + (S.isOwner ? '<div class="btns"><button class="btn ghost" data-click="loadGroups">Show my groups</button></div>' + (S.ui.groups ? '<div class="fields" style="margin-top:10px;max-width:640px">' + fld('Group', bindSel('shareGroup', S.ui.groups.map(g => [g.id, g.title]), S.ui.shareGroup, 'Choose…')) + '<div style="align-self:flex-end"><button class="btn" data-click="shareGroup">Share</button></div></div>' : '') + (S.ui.shareMsg ? '<p class="msg">' + esc(S.ui.shareMsg) + '</p>' : '') : '<p class="muted">Only the owner (' + esc(S.svc.owner) + ') can share the layer.</p>') + '</div>' +
    '<div class="panel"><h2>Protection of the change log</h2><p class="sub">ArcGIS records who created and edited each record (server time), and the ChangeLog table accepts new rows only, so the log cannot be altered from the tool, ArcGIS Online or Excel.</p>' +
    (p ? '<p>' + (p.tracking ? '✔ Editor tracking is on.' : '✖ Editor tracking is not on.') + '<br>' + (p.logInsertOnly ? '✔ The change log is insert-only.' : '✖ The change log can still be edited in ArcGIS.') + '</p>' : '<p class="muted">Not applied yet.</p>') + (S.isOwner && !(p && p.tracking && p.logInsertOnly) ? '<button class="btn sec" data-click="harden">Apply the protection</button>' : '') + '</div></div>';
}
// ---------------------------------------------------------------- Guidelines (user manual inside the tool)
const GUIDE = [
  ['about', 'About the tool', () => '<p>The Annual Operational Planning Tool replaces the Excel TIP/AOP workbook. It holds one country office\'s operational plan: the task list, the task implementation plans (activities, teams, dates), the teams and programme assets, the working calendar, weekly progress and the operational plans for the year, quarter and month.</p>' +
    '<p>Everyone in the country team uses the same link and sees the same plan. All data is saved automatically in the country office\'s own ArcGIS Online layer — nothing is stored in the browser — so the plan does not depend on one person or one computer.</p>' +
    '<div class="call"><b>In one sentence:</b> register the tasks, plan which teams do what and when, get the plans checked and approved, record what the teams actually did every week, and follow the dashboards to see where the programme is ahead of or behind plan.</div>'],
  ['start', 'Getting started', () => '<ol><li>Open your country\'s link and choose <b>Sign in with ArcGIS</b>. Use your NPA ArcGIS Online account.</li><li>The <b>Home</b> page shows what is waiting for you, the main figures and the latest alerts.</li><li>The header shows the country, the <b>year</b> and the <b>status date</b>. The status date is the "today" used for plan vs achieved and for overdue checks; change it to look at the plan as at another date (only your view changes).</li><li>The white pill shows whether your changes are saved. "All changes saved" means they are in ArcGIS Online. If the connection drops, changes wait on your computer and are sent when it returns.</li><li>The round arrow next to it shows the latest changes made by other users (the tool also refreshes every minute).</li></ol>' +
    '<h3>The sections</h3><table class="t"><tbody>' + [['Home', 'Your to-do list, key figures, alerts, where the teams are'], ['Tasks', 'Task list, task status, the task implementation plan (activities and teams), approval'], ['Teams & assets', 'Teams, programme assets (MDD, Mechanical, Manual, EORE, EOD, CPP…), productivity rates'], ['Calendar', 'Public holidays, leave, stand-by, training, maintenance'], ['Schedule', 'Gantt chart of all teams or all tasks'], ['Progress', 'Weekly progress: enter, upload the weekly report, all records'], ['Dashboards', 'Plan vs achieved, deviations, productivity, donors, outputs and downtime'], ['Operational plans', 'Annual, quarterly and monthly plans with verification and approval'], ['Alerts', 'Automatic checks'], ['Settings', 'Plan settings, import, users and roles, change log, connection'], ['Guidelines', 'This guide']].map(r => '<tr><td style="width:170px"><b>' + r[0] + '</b></td><td>' + r[1] + '</td></tr>').join('') + '</tbody></table>'],
  ['roles', 'Roles and responsibilities', () => '<p>Each user has one or more roles, set in <b>Settings › Users and roles</b> by the IM officer. The tool shows each person only the buttons for their roles, and it never lets anyone check or approve their own work: whoever edited or submitted a plan cannot quality-check it, and whoever checked it cannot approve it.</p><table class="t"><thead><tr><th>Role</th><th>Main responsibilities</th></tr></thead><tbody>' + Object.keys(ROLES).map(k => '<tr><td><b>' + ROLES[k].label + '</b></td><td>' + ROLES[k].desc + '</td></tr>').join('') + '</tbody></table><p class="small muted">Until the first roles are assigned, the tool runs in set-up mode: every editor can do every step. Assign roles before the plan is used for approvals.</p>'],
  ['process', 'The planning process', () => '<div class="flow"><span>1 Set up teams, assets, calendar, rates</span><b>›</b><span>2 Register tasks</span><b>›</b><span>3 Plan activities and teams</span><b>›</b><span>4 Submit</span><b>›</b><span>5 QC (QM officer)</span><b>›</b><span>6 Approve (Operations manager)</span><b>›</b><span>7 Operational plans</span><b>›</b><span>8 Weekly progress</span><b>›</b><span>9 Review deviations, revise</span></div>' +
    '<p>This follows the NPA operational planning process: the coding and calendar are set up and checked first; each task gets a task implementation plan that is quality-checked and approved; the annual, quarterly and monthly operational plans are extracted from the task plans and approved; and progress is followed against the approved plans during the year.</p>' +
    '<div class="call">An <b>approved</b> task plan is frozen: it becomes the baseline that achieved work is compared with. Changing the activities afterwards creates a <b>revision</b> (version +1) that must go through QC and approval again. The old baseline stays in use until the revision is approved.</div>'],
  ['setup', 'Setting up the plan', () => '<p>Set up once at the start of the year (or copy from last year in Settings › Plan settings):</p><ol><li><b>Teams</b> (Teams & assets › Teams): name, type (Manual, MDD, Mechanical, EOD, EORE, NTS, TS, CPP, QA/QC), units, base, leader and, if the team only works part of the year, the dates it is available.</li><li><b>Assets</b>: every dog, machine, kit and vehicle, with its capacity, team, quantity and status.</li><li><b>Calendar</b>: the national public holidays, the working week, planned leave, stand-by, training and maintenance.</li><li><b>Productivity rates</b>: m² per team per effective working day for each team type and method. The tool starts with default rates; replace them with your own averages.</li></ol>' +
    '<h3>Importing instead of typing</h3><p>Every list can be imported from Excel: download the template (Settings › Import, or the Template button on each list), fill it, upload it. The tool checks every row and lists the problems before anything is saved. Re-importing the same file updates rows instead of duplicating them. A sample workbook with fictional data shows how the sheets are filled.</p>'],
  ['tasks', 'Tasks and task status', () => '<p>Register each task with its IMSMA hazard/task ID, place, donor or project, area and contamination. Click a task to open it. Every task has a <b>status</b>:</p><table class="t"><tbody>' +
    [['Planned', 'Registered and planned, work not started.'], ['Ongoing', 'Work has started.'], ['Suspended', 'Work stopped for a while (access, security, weather, funding…). A reason and date are required. From that date the task\'s teams and assets are <b>released</b> and can be planned elsewhere. When work resumes, choose <b>Resume</b>: the unfinished activities move to the resume date and the plan becomes a revision for approval.'], ['Completed', 'Work finished. Activities that started are marked completed; planned days after the completion date are released. <b>No teams or assets can be deployed to a completed task</b> any more, and no progress can be recorded after its completion date. Re-open it (with a reason) if work must continue.']].map(r => '<tr><td style="width:120px">' + badge(r[0]) + '</td><td>' + r[1] + '</td></tr>').join('') + '</tbody></table><p>Every status change is recorded in the change log with the reason.</p>'],
  ['plan', 'Planning activities and teams', () => '<p>On the task page, <b>Add activity</b>: choose the activity and method, the teams, the area, the start date and — if you want — the activity it must follow (for example clearance after NTS). The tool:</p><ul><li>splits the area between the teams according to their productivity rates,</li><li>works out the working days from the rates (or uses the days you enter),</li><li>places the work on each team\'s own calendar, so holidays, leave, stand-by and training push the end date,</li><li>warns about double bookings, overdue activities and work that does not fit in the year.</li></ul><p>Use <b>Edit</b> on an activity to change it at any time while the plan is in draft. When the plan is ready, <b>Submit for QC</b>. While it is with the QM officer or the Operations manager it cannot be changed; they can return it with a comment.</p><p>Activity status (Planned, Ongoing, Completed) is updated on the task page; the task status is set separately.</p>'],
  ['assets', 'Programme assets', () => '<p>Teams & assets › Assets lists the programme\'s capacity: MDD dogs, mechanical assets, manual demining kits, EORE, EOD and CPP kits, NTS and TS equipment, QA/QC equipment, vehicles and other equipment. Each asset belongs to a team (or to the programme) and has a status: Operational, Standby, Maintenance or Retired.</p><p>The tool shows where each asset is <b>now</b> (at the status date):</p><ul><li><b>Deployed</b> – its team is working on a task this week,</li><li><b>Idle</b> or <b>Standby</b> – available,</li><li><b>Maintenance, Retired, Not available</b> – cannot be used.</li></ul><p>Assets follow their team: when a task is completed or suspended, its team and assets are released automatically. An alert appears when an asset is in maintenance while its team is deployed.</p>'],
  ['progress', 'Weekly progress', () => '<p>Every week, each team\'s work is recorded: days worked, m² processed and how much of it was cleared, reduced or cancelled, items found (AP, AT, UXO/CMR), EORE sessions and people reached, and hours lost (internal and external, as in the MPR).</p><h3>Two ways</h3><ol><li><b>Weekly entry</b>: the tool lists the teams and activities planned for the week with the planned days and m². Type the actual figures; they save at once and the deviation is shown on each row.</li><li><b>Upload weekly report</b>: download the standard template (blank, or pre-filled with the week\'s planned teams), fill it in Excel and upload it. Rows are checked before they are saved; uploading the same week again updates the rows.</li></ol><div class="call">Only work on area methods (NTS, TS, clearance) counts as area achieved. Mechanical ground preparation, EORE, EOD and QA are recorded but not counted as released land, so nothing is counted twice.</div>'],
  ['dash', 'Dashboards and deviations', () => '<p><b>Planned</b> figures come from the approved task plans (the current plan where a task is not yet approved). <b>Achieved</b> figures come from the weekly progress. <b>Planned to date</b> is the work that should have been done before the status date.</p><p><b>Deviation</b> = achieved to date ÷ planned to date − 1. Beyond <b>±' + model().DEV + '%</b> (set in Plan settings) it is highlighted red (behind) or blue (ahead) and an alert is raised.</p><ul><li><b>Plan vs achieved</b>: cumulative and weekly charts, month table, year-end forecast at the current pace. Filter by donor, district or priority.</li><li><b>Deviations by task</b>: every task with work due, sorted by deviation.</li><li><b>Team productivity</b>: actual m² per day worked against the planned rate (after 3 days of work). A large difference means the schedule will slip: revise the plan or the rate.</li><li><b>Donors and projects</b>, <b>Outputs and downtime</b>: land released, items found, EORE reach, hours lost.</li></ul>'],
  ['opplans', 'Operational plans', () => '<p>Operational plans are extracted from the task plans for the year, each quarter and each month: area by activity and method, team-days by team, by donor and by month, and the list of tasks. Draft task plans are included and flagged.</p><p>Flow: <b>Generated</b> (planning officer) → <b>Verified</b> (Operations manager) → <b>Approved</b> (Programme manager). Either can return it with a reason. If the task plans change after generation, the tool asks for a new version. Every version is kept; export any version to Excel.</p>'],
  ['alerts', 'Alerts', () => '<p>The tool checks the plan after every change and lists what needs attention: programme or tasks behind plan beyond the threshold, productivity deviations, double bookings, work that does not fit in the year, suspended tasks, overdue activities, missing weekly progress, assets in maintenance and plans waiting for QC or approval. Mark an alert as noted once it is dealt with; it reappears if the situation changes.</p>'],
  ['log', 'Change log and data protection', () => '<p>Every change is written to the change log: who, when, the values before and after, and the reason where one is required (status changes, returns, revisions, deletions). The log can only be added to. When the plan layer is created, ArcGIS Online also records the creator and editor of every record and makes the log insert-only.</p><p>If two people work at the same time and one of them approves or returns a plan, the other\'s unsaved changes to that plan are not saved and they are told, so nothing approved is overwritten.</p>'],
  ['country', 'Setting up a country (IM)', () => '<p>Each country office has its own copy of the tool in its own GitHub repository and its own link, for example <code>https://npa-im.github.io/aop-cambodia/</code>. The copy is the same for all countries; only <code>config.js</code> differs.</p><ol><li>Create the repository from the package (folder <code>aop-tool</code>) and switch on GitHub Pages.</li><li>In ArcGIS Online create OAuth 2.0 developer credentials with the repository link as redirect URL; copy the Client ID.</li><li>Edit <code>config.js</code>: country name, portal URL, Client ID.</li><li>Open the link, sign in, choose <b>Create the plan layer</b>. Then Settings › Connection › <b>Download config.js</b> and replace the file in the repository, so the item ID is fixed.</li><li>Share the layer with the country\'s ArcGIS group (an update group for editors), add the users in Settings › Users and roles, and import the lists.</li></ol><p>The full step-by-step rollout guide is delivered with the package.</p>'],
  ['glossary', 'Glossary and FAQ', () => '<table class="t"><tbody>' + [['TIP', 'Task implementation plan: the activities, teams and dates for one task.'], ['AOP', 'Annual operational plan.'], ['Effective working day', 'A working day that is not a holiday, leave, stand-by, training or maintenance day for the team.'], ['Productivity rate', 'm² one team processes per effective working day with a given method.'], ['Baseline', 'The approved, frozen version of a task plan used for plan vs achieved.'], ['Revision', 'A changed approved plan; needs QC and approval again.'], ['Status date', 'The date the plan is read at ("today").'], ['Deviation', 'Achieved to date ÷ planned to date − 1.']].map(r => '<tr><td style="width:200px"><b>' + r[0] + '</b></td><td>' + r[1] + '</td></tr>').join('') + '</tbody></table>' +
    '<h3>Frequently asked</h3><p><b>Can I work offline?</b> Briefly: changes wait on your computer and are sent when the connection returns. Keep the page open until it says "All changes saved".</p><p><b>Why can\'t I edit a plan?</b> It is with QC or the Operations manager, the task is completed, or your role does not include planning.</p><p><b>Why can\'t I add a team to a task?</b> The task is completed: no deployments are allowed. Re-open it if work must continue.</p><p><b>Where are earlier years?</b> Change the year in the header.</p>']
];
PAGES.guide = function () {
  return '<div class="gl"><nav aria-label="Guide contents">' + GUIDE.map((g, i) => '<a href="#g-' + g[0] + '" data-click="jump" data-arg="g-' + g[0] + '">' + (i + 1) + '. ' + g[1] + '</a>').join('') + '</nav><div class="stack">' + GUIDE.map((g, i) => '<section class="panel" id="g-' + g[0] + '"><h2>' + (i + 1) + '. ' + g[1] + '</h2>' + g[2]() + '</section>').join('') + '</div></div>';
};
// ---------------------------------------------------------------- actions
const Yn = () => Number(S.year);
const taskFields = t => [
  { k: 'task_id', label: 'Task / hazard ID (IMSMA)', req: true, value: t.task_id || '' }, { k: 'name', label: 'Short name', value: t.name || '' },
  { k: 'province', label: 'Province', value: t.province || '' }, { k: 'district', label: 'District', value: t.district || '' }, { k: 'village', label: 'Village', value: t.village || '' },
  { k: 'donor', label: 'Donor / project', value: t.donor || '' }, { k: 'area_m2', label: 'Hazard area, m²', type: 'number', req: true, value: t.area_m2 || '' },
  { k: 'contamination', label: 'Contamination', type: 'select', options: CONT_TYPES, value: t.contamination || 'CMRs' }, { k: 'priority', label: 'Priority', type: 'select', options: PRIORITY, value: t.priority || 'Medium' }, { k: 'notes', label: 'Notes', type: 'textarea', value: t.notes || '' }];
function xlsxOut(name, sheets) { return loadXLSX().then(X => { const wb = X.utils.book_new(); sheets.forEach(s => { const ws = X.utils.aoa_to_sheet(s[1]); ws['!cols'] = (s[1][0] || []).map(h => ({ wch: Math.max(10, String(h).length + 3) })); X.utils.book_append_sheet(wb, ws, s[0].slice(0, 31)); }); X.writeFile(wb, name); }).catch(e => toast(e.message)); }
const fileTag = () => countryName().replace(/[^A-Za-z0-9]/g, '') + '_' + S.year;
function demoRows(kind) { const D = demoData(S.year), head = IMP[kind].cols.map(c => c.k); return D[kind].map(o => { const r = {}; head.forEach(h => { r[h] = o[h] === undefined ? '' : o[h]; }); return r; }); }

const ACTIONS = {
  go(a) { go(a); }, jump(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  reload() { location.reload(); }, signIn() { beginSignIn(); }, signOut() { signOut(); },
  saveConfig() { const p = document.getElementById('cfgPortal').value.trim(), c = document.getElementById('cfgClient').value.trim(); if (!c) { S.error = 'Paste the Client ID.'; return render(); } ls.set('aop.portalUrl', p); ls.set('aop.clientId', c); S.error = ''; boot(); },
  pickCountry() { if (!S.ui.pickCountry) { S.error = 'Choose the country office.'; return render(); } CFG.country = S.ui.pickCountry; ls.set('aop.country', CFG.country); S.error = ''; boot(); },
  async createService() { S.phase = 'busy'; S.busy = 'Creating the ' + countryName() + ' plan layer'; render(); try { const svc = await createPlanService(countryName()); await openService(svc.itemId, true); } catch (e) { S.phase = 'choose'; S.error = e.message; render(); } },
  async openService(id) { S.phase = 'busy'; S.busy = 'Opening the plan'; render(); try { await openService(id); } catch (e) { S.phase = 'choose'; S.error = e.message; render(); } },
  async refreshNow() { if (hasPending()) await flush(); const ok = await refreshData(true); toast(ok ? 'Showing the latest data.' : 'Could not read the latest data; check the connection.'); },
  modalOk() {
    const m = S.modal; if (!m) return;
    document.querySelectorAll('[data-mf]').forEach(el => { m.values[el.getAttribute('data-mf')] = el.value; });
    const miss = (m.fields || []).filter(f => f.req && !String(m.values[f.k] === undefined ? f.value || '' : m.values[f.k]).trim());
    if (miss.length) { m.err = 'Fill in: ' + miss.map(f => f.label).join(', ') + '.'; return render(); }
    const v = {}; (m.fields || []).forEach(f => { v[f.k] = m.values[f.k] === undefined ? (f.value === undefined ? '' : f.value) : m.values[f.k]; });
    const res = m.onOk ? m.onOk(v) : true;
    if (res === false) return render();
    if (typeof res === 'string') { m.err = res; return render(); }
    if (S.modal === m) S.modal = null; render();
  },
  modalCancel() { S.modal = null; render(); },
  modalDel() { const m = S.modal; if (m && m.onDel) { S.modal = null; m.onDel(); } },
  taskFilter(s) { S.ui.tf = Object.assign(S.ui.tf || { q: '', ps: 'All', donor: '', dist: '' }, { st: s }); S.ui.sel = null; S.tab = 'tasks'; render(); },
  // ---- tasks
  taskNew() { ACTIONS.taskEdit(''); },
  taskEdit(u) {
    const t = u ? getRec('tasks', u) : {}; if (!can('tasks')) return;
    ask({ title: u ? 'Edit task ' + t.task_id : 'Register a task', fields: taskFields(t), ok: u ? 'Save' : 'Register',
      onDel: u && !rows('activities').some(a => a.task_uid === u) && !rows('progress').some(p => p.task_uid === u) ? () => askReason('Delete task ' + t.task_id, 'The task has no activities or progress.', 'Delete', r => { del('tasks', u, { reason: r }); S.ui.sel = null; render(); }, true) : null, delLabel: 'Delete task',
      onOk: v => {
        const id = v.task_id.trim(), area = Number(v.area_m2);
        if (rows('tasks', S.year).some(x => x.task_id === id && x.uid !== u)) return 'Task ' + id + ' is already in the ' + S.year + ' list.';
        if (!(area >= 0) || v.area_m2 === '') return 'Enter the area (0 for EORE, EOD or other tasks without hazard area).';
        const rec = { uid: u || undefined, plan_year: Yn(), task_id: id, name: v.name, province: v.province, district: v.district, village: v.village, donor: v.donor, area_m2: area, contamination: v.contamination, priority: v.priority, notes: v.notes };
        if (!u) Object.assign(rec, { status: 'Planned', plan_status: 'Draft', plan_version: 1, cancel_pct: 0, reduce_pct: 0 });
        const nu = put('tasks', rec); if (!u) { S.ui.sel = nu; S.tab = 'tasks'; toast('Task ' + id + ' registered. Add its activities next.'); }
      } });
  },
  taskStatus(arg) {
    const p = arg.split('|'), u = p[0], to = p[1], t = getRec('tasks', u); if (!t || !can('taskStatus')) return;
    const M = model(), from = t.status || 'Planned', resume = from === 'Suspended' && to === 'Ongoing', reopen = from === 'Completed';
    const title = to === 'Suspended' ? 'Suspend task ' + t.task_id : to === 'Completed' ? 'Mark task ' + t.task_id + ' completed' : resume ? 'Resume task ' + t.task_id : reopen ? 'Re-open task ' + t.task_id : 'Start task ' + t.task_id;
    const text = to === 'Suspended' ? 'From this date the task\'s teams and assets are released and can be planned elsewhere. The plan stays as it is; resume it when work restarts.' : to === 'Completed' ? 'Started activities are marked completed. Planned days after this date are released, and no teams or assets can be deployed to the task any more.' : resume ? 'Unfinished activities can be moved to start on the resume date, with their remaining days and area. That changes the plan, so it will need approval again.' : reopen ? 'Re-opening allows teams to be deployed again.' : 'The task status becomes Ongoing.';
    const fields = [{ k: 'date', label: to === 'Suspended' ? 'Suspended from' : to === 'Completed' ? 'Completed on' : 'Date', type: 'date', req: true, value: M.TODAY, min: M.Y + '-01-01', max: M.Y + '-12-31' }, { k: 'reason', label: to === 'Suspended' ? 'Reason for the suspension' : 'Reason / note', type: 'textarea', req: to === 'Suspended' || reopen || resume }];
    if (resume) fields.push({ k: 'move', label: 'Move unfinished activities to the resume date?', type: 'select', options: ['Yes', 'No'], value: 'Yes' });
    ask({ title: title, text: text, fields: fields, ok: to === 'Suspended' ? 'Suspend' : to === 'Completed' ? 'Mark completed' : 'Confirm', onOk: v => {
      if (v.date.slice(0, 4) !== S.year) return 'The date must be in ' + S.year + '.';
      put('tasks', { uid: u, status: to, status_date: v.date, status_reason: to === 'Suspended' ? v.reason : (v.reason || '') }, { reason: v.reason, summary: 'Task ' + t.task_id + ': ' + from + ' → ' + to });
      if (to === 'Completed') rows('activities').filter(a => a.task_uid === u && a.status !== 'Completed' && a.start_date && a.start_date <= v.date).forEach(a => put('activities', { uid: a.uid, status: 'Completed' }, { summary: 'Activity completed with task ' + t.task_id }));
      if (resume && v.move === 'Yes') {
        const Mx = model(); let moved = 0;
        Mx.acts.filter(a => a.task.uid === u && a.status !== 'Completed').forEach(a => {
          const done = Math.max.apply(null, [0].concat(Mx.asg.filter(r => r.a === a).map(r => r.used.length))), left = a.days - done; if (left <= 0) return;
          const f = left / a.days; moved++;
          put('activities', { uid: a.uid, start_date: v.date > (a.s || '') ? v.date : a.s, work_days: left, status: 'Planned' }, { reason: 'Resumed after suspension', summary: 'Activity moved after suspension: ' + t.task_id + ' ' + a.method });
          a.asg.forEach(x => put('assignments', { uid: x.uid, area_m2: Math.round(x.m2 * f) }, { nolog: true }));
        });
        if (moved) touchPlan(u, 'resumed after suspension');
      }
      if (to === 'Ongoing' && from === 'Planned') toast('Task ' + t.task_id + ' started.');
    } });
  },
  printTip(u) { printTip(u); },
  planSubmit(u) {
    const t = getRec('tasks', u), M = model(); if (!t || !can('submit')) return;
    const i = M.taskInfo[u], issues = [];
    if (!i.planned) issues.push('no activities');
    if (i.acts.some(a => !a.asg.length)) issues.push('an activity has no team');

  setSetting('status_date', S.year, D.statusDate); setSetting('demo', 0, '1');
  const M = model(); M.T.forEach(t => { if (t.task_id === 'KH-RTK-27-18' || t.task_id === 'KH-RTK-27-15') return; put('tasks', { uid: t.uid, plan_status: 'Approved', approved_by: 'sample.om', approved_on: nowIso(), submitted_by: 'sample.planner', submitted_on: nowIso(), qc_by: 'sample.qm', qc_on: nowIso(), baseline: baselineOf(getRec('tasks', t.uid), M), editors: '' }, { nolog: true }); });
  const t15 = M.T.find(t => t.task_id === 'KH-RTK-27-15'); if (t15) put('tasks', { uid: t15.uid, plan_status: 'Submitted', submitted_by: 'sample.planner', submitted_on: nowIso(), editors: 'sample.planner' }, { nolog: true }); const t18 = M.T.find(t => t.task_id === 'KH-RTK-27-18'); if (t18) put('tasks', { uid: t18.uid, plan_status: 'QC passed', submitted_by: 'sample.planner', submitted_on: nowIso(), qc_by: 'sample.qm', qc_on: nowIso(), qc_note: 'Checked against SOPs (sample)', editors: 'sample.planner' }, { nolog: true });
  [['sample.planner', 'Sample Planner', 'PLANNER'], ['sample.qm', 'Sample QM officer', 'QM'], ['sample.om', 'Sample Operations manager', 'OPS_MANAGER']].forEach(r => put('roles', { plan_year: 0, username: r[0], full_name: r[1], role: r[2], active: 1 }, { nolog: true }));
  Object.keys(ROLES).filter(r => r !== 'VIEWER').forEach(r => put('roles', { plan_year: 0, username: 'demo.user', full_name: 'Demo User', role: r, active: 1 }, { nolog: true }));
  rows('changelog').forEach(r => DB.changelog.delete(r.uid));
  logChange('settings', 'demo', 'create', null, null, { summary: 'Demo started with fictional sample data' });
  flush(); bump();
  S.phase = 'app'; S.tab = 'home'; render();
}
async function boot() {
  try {
    if (CFG.demo || new URLSearchParams(location.search).has('demo')) { startDemo(); return; }
    if (!CFG.country) CFG.country = ls.get('aop.country', '');
    if (!CFG.country) { S.phase = 'country'; render(); return; }
    const q = new URLSearchParams(location.search);
    if (q.get('error')) { S.error = q.get('error_description') || q.get('error'); history.replaceState(null, '', redirectUri()); }
    if (!clientId()) { S.phase = 'config'; render(); return; }
    if (q.get('code')) { await completeSignIn(q.get('code'), q.get('state')); history.replaceState(null, '', redirectUri()); }
    if (!ls.get('aop.auth', null)) { S.phase = 'signin'; render(); return; }
    S.phase = 'busy'; S.busy = 'Signing in'; render();
    let who;
    try { who = await api(portal() + '/sharing/rest/community/self', {}, 'GET'); }
    catch (e) { ls.del('aop.auth'); S.phase = 'signin'; S.error = 'Please sign in again.'; render(); return; }
    S.user = { username: who.username, fullName: who.fullName };
    S.busy = 'Opening the ' + countryName() + ' plan'; render();
    const fixed = CFG.itemId || ls.get(lsKey('service'), null);
    if (fixed) { try { await openService(fixed); return; } catch (e) { if (CFG.itemId) throw new Error('The plan layer in config.js could not be opened: ' + e.message + ' Check that it is shared with you.'); ls.del(lsKey('service')); } }
    S.services = await findPlanServices();
    if (S.services.length === 1) { await openService(S.services[0].itemId); return; }
    S.phase = 'choose'; render();
  } catch (e) { S.phase = 'fatal'; S.error = e.message; render(); }
}
boot();
